<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requirements | Mohammed Eto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a; color: #fff; font-family: 'Cairo', sans-serif;
            margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .req-card {
            background: #141414; border: 1px solid #333; padding: 40px; border-radius: 20px;
            max-width: 500px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative; overflow: hidden;
        }
        .req-card::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #00ff88, #0a0a0a); z-index: -1; border-radius: 22px;
        }
        h1 { color: #00ff88; margin-bottom: 30px; }
        .info-row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #222; }
        .info-row:last-child { border: none; }
        .info-title { color: #b0b0b0; font-weight: bold; }
        .info-value { color: #fff; }
        .back-btn {
            display: inline-block; margin-top: 30px; padding: 10px 20px;
            background: #00ff88; color: #000; text-decoration: none; border-radius: 8px; font-weight: bold;
        }
        .back-btn:hover { box-shadow: 0 0 15px rgba(0,255,136,0.5); }
    </style>
</head>
<body>

    <div class="req-card" id="card-content" style="display: none;">
        <h1 id="p-name"><i class="fas fa-cogs"></i> مواصفات التشغيل</h1>
        <div class="info-row">
            <span class="info-title">حجم المشروع:</span>
            <span class="info-value" id="p-size">-</span>
        </div>
        <div class="info-row" style="flex-direction: column; text-align: right; gap: 10px;">
            <span class="info-title">المتطلبات / النظام:</span>
            <span class="info-value" id="p-req">-</span>
        </div>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-right"></i> رجوع للموقع</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        if(projectId) {
            fetch('projects.json')
                .then(res => res.json())
                .then(data => {
                    const project = data[projectId];
                    if(project) {
                        document.getElementById('card-content').style.display = 'block';
                        document.getElementById('p-name').innerHTML = `<i class="fas fa-cogs"></i> ${project.name}`;
                        document.getElementById('p-size').innerText = project.size;
                        document.getElementById('p-req').innerText = project.requirements;
                    }
                });
        }
    </script>
</body>
</html>
